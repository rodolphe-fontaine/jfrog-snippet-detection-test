name: Frogbot Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: write
  security-events: write

jobs:
  frogbot-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: jfrog/frogbot@v3
        with:
          version: latest
        env:
          JFROG_CLI_LOG_LEVEL: DEBUG
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
          JF_USE_CONFIG_PROFILE: "true"
          JF_WATCHES: ${{ vars.JF_SNIPPET_WATCHES || 'minimum-to-respect' }}
          # Default *test* excludes this repo (name contains "test") — use narrower patterns.
          JF_PATH_EXCLUSIONS: "*git*;*node_modules*;*target*;*venv*;dist;**/test/**;**/*.test.js;package_list;sbom.json"
          JF_GIT_PROVIDER: github
          JF_GIT_OWNER: ${{ github.repository_owner }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_GIT_REPO: ${{ github.event.repository.name }}
          JF_GIT_BASE_BRANCH: main
          JF_GIT_PULL_REQUEST_ID: ${{ github.event.pull_request.number }}
